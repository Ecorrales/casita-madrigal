<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cooking Mama · Planeador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f6f1e7;
    --cream-2: #efe7d8;
    --ink: #2a1f1a;
    --ink-soft: #6b5d52;
    --terra: #c8683c;
    --gold: #d9a441;
    --leaf: #7a8c4e;
    --sky: #5b8ca8;
    --rose: #c77;
    --line: #e0d6c4;
    --white: #fffdf8;
    --shadow: rgba(80, 55, 30, 0.12);

    /* Colores por proteína */
    --p-pollo: #d9a441;
    --p-cerdo: #c77b8b;
    --p-pescado: #5b8ca8;
    --p-res: #b5563f;
    --p-detox: #7a8c4e;

    /* Acento estacional (default otoño, se sobreescribe por JS) */
    --season-accent: var(--terra);
    --season-soft: color-mix(in srgb, var(--terra) 14%, transparent);
    --season-band: #f3e4d2;
  }

  /* ===== TEMAS ESTACIONALES ===== */
  /* Invierno: verde pino, rojo, dorado */
  body[data-season="invierno"] {
    --season-accent: #2f6b4f;
    --season-soft: color-mix(in srgb, #2f6b4f 12%, transparent);
    --season-band: #e8f0ea;
  }
  /* Primavera: rosa, verde tierno, amarillo */
  body[data-season="primavera"] {
    --season-accent: #d16b93;
    --season-soft: color-mix(in srgb, #d16b93 12%, transparent);
    --season-band: #fbeef3;
  }
  /* Verano: turquesa, arena, coral */
  body[data-season="verano"] {
    --season-accent: #2d9db3;
    --season-soft: color-mix(in srgb, #2d9db3 12%, transparent);
    --season-band: #e3f3f5;
  }
  /* Otoño (su favorita): naranja quemado, ocre, café */
  body[data-season="otono"] {
    --season-accent: #c26a2b;
    --season-soft: color-mix(in srgb, #c26a2b 13%, transparent);
    --season-band: #f6e7d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  .cm-header {
    padding: 18px 20px 14px;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--season-band) 70%, var(--white)),
      var(--season-band));
    border-bottom: 1px solid color-mix(in srgb, var(--season-accent) 18%, transparent);
    position: sticky;
    top: 0;
    z-index: 50;
    overflow: hidden;
    transition: background 500ms, border-color 500ms;
  }
  .cm-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    position: relative;
    z-index: 2;
    text-align: center;
  }
  .cm-title .pan { font-size: 24px; }
  .cm-sub {
    font-size: 12.5px;
    color: var(--season-accent);
    margin-top: 2px;
    font-style: italic;
    font-family: 'Fraunces', serif;
    position: relative;
    z-index: 2;
    transition: color 500ms;
    text-align: center;
  }

  /* Guirnalda SVG estacional — corre a lo ancho del header */
  .garland-svg {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .garland-svg svg {
    position: absolute;
    top: 0;
    height: 100%;
    width: auto;
  }
  .garland-svg svg.g-left  { left: 0; }
  .garland-svg svg.g-right { right: 0; transform: scaleX(-1); }
  .cm-header { min-height: 78px; }

  /* ===== NIVEL MES ===== */
  .month-view { padding: 16px 16px 40px; max-width: 620px; margin: 0 auto; }
  .month-view[hidden] { display: none; }
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 18px;
  }
  .month-arrow {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--white);
    color: var(--terra);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 140ms, border-color 140ms;
  }
  .month-arrow:hover { background: var(--cream-2); border-color: var(--terra); }
  .month-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--ink);
    min-width: 160px;
    text-align: center;
  }
  .week-cards { display: flex; flex-direction: column; gap: 12px; }
  .week-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 18px;
    cursor: pointer;
    box-shadow: 0 1px 3px var(--shadow);
    transition: transform 130ms, box-shadow 130ms, border-color 130ms;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .week-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 16px var(--shadow);
    border-color: var(--terra);
  }
  .week-card.is-current {
    border-color: var(--gold);
    border-width: 2px;
  }
  .week-card-main { min-width: 0; }
  .week-card-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .week-card-range {
    font-size: 13px;
    color: var(--ink-soft);
  }
  .week-card-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a6410;
    background: color-mix(in srgb, var(--gold) 22%, transparent);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .week-card-count {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .week-card-count .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--leaf);
    display: inline-block;
  }
  .week-card-count.empty .dot { background: var(--line); }

  /* ===== TOPBAR DE SEMANA ===== */
  .week-view[hidden] { display: none; }
  .week-topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .back-to-month {
    border: 1.5px solid var(--line);
    background: var(--cream);
    color: var(--terra);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 140ms;
    white-space: nowrap;
  }
  .back-to-month:hover { background: var(--cream-2); }
  .week-range {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }

  /* ===== LAYOUT DE DOS COLUMNAS ===== */
  .cm-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    height: calc(100vh - 74px - 53px);
  }
  @media (max-width: 720px) {
    .cm-layout { grid-template-columns: 1fr; height: auto; }
  }

  /* ===== COLUMNA IZQUIERDA: LA SEMANA ===== */
  .cm-week {
    padding: 14px 12px 40px;
    overflow-y: auto;
    border-right: 1px solid var(--line);
  }
  @media (max-width: 720px) {
    .cm-week { border-right: none; border-bottom: 1px solid var(--line); }
  }
  .cm-col-label {
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 0 6px 10px;
  }

  .day-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .day-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .day-name .day-num {
    font-size: 11px;
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
  }

  .meal-slot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 9px;
    border: 1.5px dashed var(--line);
    margin-bottom: 5px;
    min-height: 42px;
    transition: border-color 160ms, background 160ms;
  }
  .meal-slot:last-child { margin-bottom: 0; }
  .meal-slot.drop-hover {
    border-color: var(--terra);
    background: color-mix(in srgb, var(--terra) 8%, transparent);
  }
  .meal-slot.tap-target {
    border-color: var(--gold);
    background: color-mix(in srgb, var(--gold) 12%, transparent);
    animation: pulse-target 1.2s ease-in-out infinite;
  }
  @keyframes pulse-target {
    0%,100% { border-color: var(--gold); }
    50% { border-color: var(--terra); }
  }
  .meal-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    width: 58px;
    flex-shrink: 0;
  }
  .meal-content { flex: 1; min-height: 20px; display: flex; align-items: center; }
  .meal-empty {
    font-size: 12px;
    color: color-mix(in srgb, var(--ink-soft) 60%, transparent);
    font-style: italic;
    font-family: 'Fraunces', serif;
  }

  .placed-dish {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--cream-2);
    border-radius: 7px;
    padding: 4px 8px 4px 7px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    max-width: 100%;
    border-left: 3px solid var(--slot-color, var(--terra));
  }
  .placed-dish .dish-x {
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    opacity: 0.5;
  }
  .placed-dish .dish-x:hover { opacity: 1; color: var(--terra); }

  /* ===== COLUMNA DERECHA: LOS PLATILLOS ===== */
  .cm-catalog {
    padding: 14px 12px 40px;
    overflow-y: auto;
    background: var(--cream-2);
  }

  /* Pestañas por proteína */
  /* Contenedor fijo: pestañas + buscador quedan arriba al scrollear */
  .catalog-sticky {
    position: sticky;
    top: 0;
    background: var(--cream-2);
    padding-bottom: 10px;
    margin-bottom: 2px;
    z-index: 10;
  }
  .protein-tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .protein-tab {
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1.5px solid transparent;
    background: var(--white);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 140ms;
    white-space: nowrap;
  }
  .protein-tab[data-p="pollo"].active   { background: var(--p-pollo); color: #fff; }
  .protein-tab[data-p="cerdo"].active   { background: var(--p-cerdo); color: #fff; }
  .protein-tab[data-p="pescado"].active { background: var(--p-pescado); color: #fff; }
  .protein-tab[data-p="res"].active     { background: var(--p-res); color: #fff; }
  .protein-tab[data-p="detox"].active   { background: var(--p-detox); color: #fff; }
  .protein-tab.active { border-color: transparent; }

  /* Buscador */
  .search-wrap { position: relative; }
  .cm-search {
    width: 100%;
    padding: 9px 34px 9px 13px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
  }
  .cm-search:focus { outline: none; border-color: var(--terra); }
  .cm-search::placeholder { color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .search-clear {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border: none;
    background: var(--cream-2);
    color: var(--ink-soft);
    border-radius: 50%;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 140ms, color 140ms;
  }
  .search-clear:hover { background: var(--terra); color: #fff; }
  .search-clear[hidden] { display: none; }

  /* Tarjetas de platillo */
  .dish-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-left: 4px solid var(--dish-color, var(--terra));
    border-radius: 11px;
    padding: 0;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px var(--shadow);
    transition: transform 120ms, box-shadow 120ms;
    display: flex;
    align-items: stretch;
    overflow: hidden;
  }
  .dish-card.dragging { opacity: 0.4; }
  .dish-card.tap-selected {
    transform: scale(1.02);
    box-shadow: 0 4px 14px color-mix(in srgb, var(--terra) 30%, transparent);
    border-color: var(--terra);
  }
  .dish-card.hidden { display: none; }

  /* Asa de arrastre — puntos en retícula (solo esta zona arrastra) */
  .dish-handle {
    width: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    color: color-mix(in srgb, var(--ink-soft) 50%, transparent);
    touch-action: none;   /* solo el asa bloquea el scroll para permitir drag */
    -webkit-user-select: none;
    user-select: none;
    border-right: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
    background: color-mix(in srgb, var(--cream-2) 40%, transparent);
  }
  .dish-handle:active { cursor: grabbing; }
  .dish-handle .dotgrid {
    display: grid;
    grid-template-columns: repeat(2, 3px);
    gap: 3px;
  }
  .dish-handle .dotgrid i {
    width: 3px; height: 3px; border-radius: 50%;
    background: currentColor;
  }

  .dish-body {
    flex: 1;
    padding: 10px 12px;
    cursor: pointer;
    min-width: 0;
  }
  .dish-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .dish-name-txt {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .usual-pill {
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    background: var(--cream-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 7px;
    white-space: nowrap;
  }
  .dish-protein-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
    background: var(--dish-color, var(--terra));
  }
  .dish-ingredients {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 4px;
    line-height: 1.4;
  }

  /* Instrucción de modo tap */
  .tap-hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--cream);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms;
    max-width: 90vw;
    text-align: center;
  }
  .tap-hint.show { opacity: 1; }
  .tap-hint b { color: var(--gold); }

  /* Ghost element para drag */
  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    background: var(--white);
    border: 1px solid var(--terra);
    border-left: 4px solid var(--dish-color, var(--terra));
    border-radius: 10px;
    padding: 8px 12px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    box-shadow: 0 8px 24px rgba(80,55,30,0.3);
    opacity: 0.95;
    transform: translate(-50%, -50%) rotate(-2deg);
  }

  .proto-banner {
    background: color-mix(in srgb, var(--gold) 18%, transparent);
    border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent);
    color: #8a6410;
    font-size: 11.5px;
    text-align: center;
    padding: 6px 12px;
    font-weight: 600;
  }

  /* ===== BOTÓN VAMOS A COCINAR ===== */
  .cook-btn {
    width: 100%;
    margin-top: 16px;
    padding: 16px;
    border-radius: 16px;
    border: 2px dashed color-mix(in srgb, var(--season-accent) 45%, transparent);
    background: var(--season-soft);
    color: var(--season-accent);
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: background 140ms, transform 130ms;
  }
  .cook-btn:hover { transform: translateY(-2px); background: color-mix(in srgb, var(--season-accent) 16%, transparent); }

  /* ===== NIVEL CREAR PLATILLO ===== */
  .cook-view[hidden] { display: none; }
  .cook-form { padding: 16px 14px 40px; }
  .cook-field { margin-bottom: 16px; }
  .cook-label {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }
  .cook-hint {
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    font-style: italic;
    font-family: 'Fraunces', serif;
    color: color-mix(in srgb, var(--ink-soft) 70%, transparent);
    margin-left: 6px;
  }
  .cook-input {
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
  }
  .cook-input:focus { outline: none; border-color: var(--season-accent); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .toggle-chip {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--white);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 130ms;
  }
  .toggle-chip.on {
    background: var(--season-accent);
    color: #fff;
    border-color: var(--season-accent);
  }
  .ingredients-drop {
    min-height: 120px;
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 10px;
    transition: border-color 160ms, background 160ms;
  }
  .ingredients-drop.drop-hover {
    border-color: var(--season-accent);
    background: var(--season-soft);
  }
  .drop-empty {
    color: color-mix(in srgb, var(--ink-soft) 55%, transparent);
    font-style: italic;
    font-family: 'Fraunces', serif;
    font-size: 13px;
    text-align: center;
    padding: 34px 10px;
  }
  .ing-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cream-2);
    border-radius: 9px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .ing-row .ing-name { flex: 1; font-size: 13px; font-weight: 500; min-width: 0; }
  .ing-row .ing-qty { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .ing-row .ing-x { cursor: pointer; color: var(--ink-soft); font-size: 16px; opacity: 0.5; padding: 0 2px; }
  .ing-row .ing-x:hover { opacity: 1; color: var(--terra); }
  .finish-btn {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--leaf);
    color: #fff;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: transform 130ms, background 140ms;
  }
  .finish-btn:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--leaf) 88%, #000); }

<script>
  // ===== DATOS DE EJEMPLO (de la libreta de Mariel) =====
  const PROTEIN_COLORS = {
    pollo: 'var(--p-pollo)', cerdo: 'var(--p-cerdo)', pescado: 'var(--p-pescado)',
    res: 'var(--p-res)', detox: 'var(--p-detox)'
  };

  const DISHES = [

    { id: 'd2', nombre: 'Fajitas de cerdo', proteina: 'cerdo', usual: ['Comida', 'Cena'], ing: ['Cerdo 500g', 'Cebolla 1/4', 'Pimiento 1/2', 'Arroz 1 taza'] },

  ];

  const MEALS = ['Desayuno', 'Comida', 'Cena'];
  const DAY_NAMES = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const MONTH_ABBR = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  // ===== CATÁLOGO DE INSUMOS =====
  const SUPPLY_CATS = ['Proteínas','Carbohidratos','Verduras','Frutas','Congelados','Lácteos','Abarrotes'];
  let SUPPLIES = [
    { id:'i1', nombre:'Pechuga de pollo', cat:'Proteínas' },
    { id:'i2', nombre:'Lomo de res', cat:'Proteínas' },
    { id:'i3', nombre:'Lomo de cerdo', cat:'Proteínas' },

    { id:'i8', nombre:'Arroz', cat:'Carbohidratos' },

    { id:'i26', nombre:'Leche', cat:'Lácteos' },
    { id:'i27', nombre:'Mantequilla', cat:'Lácteos' },
    { id:'i28', nombre:'Mix de verduras congelado', cat:'Congelados' }
  ];

  // Estado del platillo en construcción
  let draftDish = { nombre:'', usual:[], tipo:null, ingredientes:[] };
  let supplyCat = 'todas';
  let supplySearch = '';
  let pendingSupply = null; // insumo esperando cantidad+unidad


  // Estado del menú: { "YYYY-MM-DD-Comida": dishId }  (clave por fecha real)
  const menu = {};

  // Estado de navegación temporal
  let viewMonth = new Date().getMonth();   // 0-11
  let viewYear = new Date().getFullYear();
  let selectedWeekStart = null;            // Date del lunes de la semana elegida
  let DAYS = [];                           // se llena al entrar a una semana

  // --- Helpers de fecha (semana ISO, lunes a domingo) ---
  function mondayOf(date) {
    const d = new Date(date);
    const day = (d.getDay() + 6) % 7; // 0 = lunes
    d.setDate(d.getDate() - day);
    d.setHours(0,0,0,0);
    return d;
  }
  function addDays(date, n) {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }
  function ymd(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }
  function fmtDay(date) {
    return `${date.getDate()} ${MONTH_ABBR[date.getMonth()]}`;
  }

  // Semanas ISO que INTERSECTAN el mes (aunque empiecen antes o terminen después)
  function weeksIntersectingMonth(year, month) {
    const firstOfMonth = new Date(year, month, 1);
    const lastOfMonth = new Date(year, month + 1, 0);
    let cursor = mondayOf(firstOfMonth);
    const weeks = [];
    while (cursor <= lastOfMonth) {
      const start = new Date(cursor);
      const end = addDays(start, 6);
      weeks.push({ start, end });
      cursor = addDays(cursor, 7);
    }
    return weeks;
  }

  // Cuántos platillos hay asignados en una semana (para el contador de la tarjeta)
  function countPlacedInWeek(weekStart) {
    let n = 0;
    for (let i = 0; i < 7; i++) {
      const dayKey = ymd(addDays(weekStart, i));
      MEALS.forEach(m => { if (menu[`${dayKey}-${m}`]) n++; });
    }
    return n;
  }

  // ===== TEMAS ESTACIONALES (hemisferio norte) =====
  const SEASONS = {
    invierno:  { meses: [11, 0, 1], text: 'Invierno · guirnaldas y esferas' },

    otono:     { meses: [8, 9, 10], text: 'Otoño · calabaza y pumpkin spice' }
  };
  let currentSeason = null;
  function seasonForMonth(month) {
    for (const key in SEASONS) {
      if (SEASONS[key].meses.includes(month)) return key;
    }
    return 'otono';
  }

  // --- Piezas SVG dibujadas a mano ---
  function hojaArce(x, y, s, rot, fill) {
    return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">
      <path d="M0,-11 L2.5,-4 L9,-6 L4,0 L10,4 L3,4 L4,11 L0,6 L-4,11 L-3,4 L-10,4 L-4,0 L-9,-6 L-2.5,-4 Z"
        fill="${fill}"/>
      <path d="M0,7 L0,13" stroke="${fill}" stroke-width="1"/>
    </g>`;
  }
  function hojaSimple(x, y, s, rot, fill) {
    return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">
      <path d="M0,-10 C6,-6 6,6 0,11 C-6,6 -6,-6 0,-10 Z" fill="${fill}"/>
      <path d="M0,-8 L0,10" stroke="rgba(90,50,10,0.35)" stroke-width="0.8"/>
    </g>`;
  }
  function calabaza(x, y, s, fill, stem) {
    return `<g transform="translate(${x},${y}) scale(${s})">
      <ellipse cx="-6" cy="1" rx="6" ry="8" fill="${fill}" opacity="0.85"/>
      <ellipse cx="6" cy="1" rx="6" ry="8" fill="${fill}" opacity="0.85"/>
      <ellipse cx="0" cy="1" rx="8" ry="9" fill="${fill}"/>
      <path d="M0,-8 Q2,-12 5,-12" stroke="${stem}" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>`;
  }
  function trigo(x, y, s, rot, fill) {
    let grains = '';
    for (let i = 0; i < 5; i++) {
      const gy = -8 + i * 3.5;
      grains += `<ellipse cx="-3" cy="${gy}" rx="2" ry="3.2" fill="${fill}" transform="rotate(-25 -3 ${gy})"/>
                 <ellipse cx="3" cy="${gy}" rx="2" ry="3.2" fill="${fill}" transform="rotate(25 3 ${gy})"/>`;
    }
    return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">
      <path d="M0,12 L0,-9" stroke="${fill}" stroke-width="1.4"/>
      ${grains}
      <path d="M0,-9 L0,-13" stroke="${fill}" stroke-width="1"/>
    </g>`;
  }
  function bellota(x, y, s, fill) {
    return `<g transform="translate(${x},${y}) scale(${s})">
      <ellipse cx="0" cy="3" rx="4" ry="5.5" fill="${fill}"/>
      <path d="M-4.5,-1 Q0,-5 4.5,-1 Z" fill="#6b4423"/>
      <path d="M0,-4 L0,-7" stroke="#6b4423" stroke-width="1.2"/>

  }
  function esfera(x, y, s, fill) {
    return `<g transform="translate(${x},${y}) scale(${s})">
      <path d="M0,-13 L0,-9" stroke="#2f6b4f" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="${fill}"/>
      <ellipse cx="-2.5" cy="-2.5" rx="2.5" ry="3.5" fill="rgba(255,255,255,0.3)"/>

  function ramaPino(x, y, s, rot) {
    return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">
      <path d="M0,12 L0,-12" stroke="#2f6b4f" stroke-width="1.6"/>
      ${[...Array(6)].map((_,i)=>{const py=-10+i*4;return `<path d="M0,${py} L-7,${py+3} M0,${py} L7,${py+3}" stroke="#3a7d5c" stroke-width="1.4"/>`;}).join('')}
    </g>`;
  }
  function flor(x, y, s, fill, centro) {
    let petalos = '';
    for (let i = 0; i < 6; i++) {
      petalos += `<ellipse cx="0" cy="-7" rx="3.5" ry="6" fill="${fill}" transform="rotate(${i*60} 0 0)"/>`;
    }
    return `<g transform="translate(${x},${y}) scale(${s})">${petalos}<circle cx="0" cy="0" r="4" fill="${centro}"/></g>`;
  }
  function hojaTierna(x, y, s, rot) {
    return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">
      <path d="M0,0 C8,-3 12,-10 8,-14 C4,-10 2,-4 0,0 Z" fill="#8bbf5a"/>
    </g>`;
  }
  function concha(x, y, s, fill) {
    return `<g transform="translate(${x},${y}) scale(${s})">
      <path d="M0,8 C-9,8 -10,-4 0,-8 C10,-4 9,8 0,8 Z" fill="${fill}"/>
      ${[...Array(5)].map((_,i)=>`<path d="M0,7 L${-8+i*4},-6" stroke="rgba(150,90,50,0.4)" stroke-width="0.8"/>`).join('')}
    </g>`;
  }
  function estrellaMar(x, y, s, fill) {
    let pts = '';
    for (let i = 0; i < 5; i++) {
      const a = (i * 72 - 90) * Math.PI / 180;
      const ai = ((i * 72 + 36) - 90) * Math.PI / 180;
      pts += `${Math.cos(a)*10},${Math.sin(a)*10} ${Math.cos(ai)*4},${Math.sin(ai)*4} `;
    }
    return `<g transform="translate(${x},${y}) scale(${s})"><polygon points="${pts}" fill="${fill}"/></g>`;
  }
  function ola(x, y, s, fill) {
    return `<g transform="translate(${x},${y}) scale(${s})">
      <path d="M-14,0 Q-10,-6 -6,0 T2,0 T10,0 T18,0" stroke="${fill}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>`;
  }

  // Ensambla el cúmulo de motivos de una estación (un lado; se refleja para el otro)
  function garlandCluster(season) {
    if (season === 'otono') {
      return hojaArce(18,20,1.1,-15,'#c26a2b')
        + hojaArce(46,14,0.9,25,'#b5563f')
        + calabaza(38,42,1.15,'#d97a2b','#7a8c4e')
        + calabaza(68,40,0.9,'#e8e0d0','#7a8c4e')
        + calabaza(92,44,1.0,'#8a9b52','#6b7742')
        + hojaArce(78,18,1.0,10,'#d9a441')
        + trigo(108,32,1.0,-18,'#c9a24a')
        + trigo(116,36,0.9,-8,'#d9b25a')
        + bellota(60,64,0.9,'#b07a3a')
        + hojaSimple(100,58,0.9,-20,'#c26a2b');
    }
    if (season === 'invierno') {
      return ramaPino(20,30,1.1,-20)
        + ramaPino(48,26,1.0,10)
        + esfera(40,50,1.0,'#b5563f')
        + esfera(64,54,0.9,'#2f6b4f')
        + esfera(86,50,1.0,'#d9a441')
        + ramaPino(80,28,1.0,25)
        + esfera(106,52,0.85,'#b5563f')
        + ramaPino(108,30,0.9,-12);
    }
    if (season === 'primavera') {
      return hojaTierna(20,40,1.2,-30)
        + flor(36,34,1.1,'#e79ac0','#f2d04a')
        + flor(62,42,1.0,'#f2b6d0','#f2d04a')
        + flor(88,36,1.15,'#e79ac0','#f2d04a')
        + hojaTierna(74,52,1.0,20)
        + flor(110,44,0.9,'#f2b6d0','#f2d04a')
        + hojaTierna(100,30,1.0,-15);
    }
    if (season === 'verano') {
      return ola(30,22,1.2,'#2d9db3')
        + ola(80,20,1.1,'#4bb8cc')
        + concha(38,46,1.1,'#e8c89a')
        + estrellaMar(66,50,0.95,'#e88d5a')
        + concha(94,48,1.0,'#dbb98a')
        + estrellaMar(110,40,0.8,'#e88d5a');
    }
    return '';
  }

  function applySeason(month) {
    const key = seasonForMonth(month);
    currentSeason = key;
    document.body.dataset.season = key;
    const wrap = document.getElementById('garland-svg');
    if (wrap) {
      const cluster = garlandCluster(key);
      const svg = `<svg viewBox="0 0 135 78" class="g-left" xmlns="http://www.w3.org/2000/svg">${cluster}</svg>`
                + `<svg viewBox="0 0 135 78" class="g-right" xmlns="http://www.w3.org/2000/svg">${cluster}</svg>`;
      wrap.innerHTML = svg;
    }
  }
  function seasonText() {
    return SEASONS[currentSeason]?.text || '';
  }

  // ===== NIVEL MES =====
  const monthView = document.getElementById('month-view');
  const weekView = document.getElementById('week-view');
  const weekCardsEl = document.getElementById('week-cards');
  const monthTitleEl = document.getElementById('month-title');
  const cmSub = document.getElementById('cm-sub');

  function renderMonth() {
    monthTitleEl.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
    applySeason(viewMonth);
    cmSub.textContent = seasonText();
    weekCardsEl.innerHTML = '';
    const weeks = weeksIntersectingMonth(viewYear, viewMonth);
    const todayMonday = mondayOf(new Date()).getTime();
    weeks.forEach((wk, i) => {
      const isCurrent = mondayOf(wk.start).getTime() === todayMonday;
      const count = countPlacedInWeek(wk.start);
      const card = document.createElement('div');
      card.className = 'week-card' + (isCurrent ? ' is-current' : '');
      card.innerHTML = `
        <div class="week-card-main">
          <div class="week-card-title">Semana ${i+1}
            ${isCurrent ? '<span class="week-card-badge">Esta semana</span>' : ''}
          </div>
          <div class="week-card-range">${fmtDay(wk.start)} – ${fmtDay(wk.end)}</div>
        </div>
        <div class="week-card-count ${count ? '' : 'empty'}">
          <span class="dot"></span>${count ? count + ' planeados' : 'sin planear'}
        </div>`;
      card.addEventListener('click', () => openWeek(wk.start));
      weekCardsEl.appendChild(card);
    });
  }

  function openWeek(weekStart) {
    selectedWeekStart = new Date(weekStart);
    // La estación de la semana: usar el jueves (día central, criterio ISO)
    const jueves = addDays(weekStart, 3);
    applySeason(jueves.getMonth());
    // Construir los 7 días reales de la semana
    DAYS = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(weekStart, i);
      DAYS.push({ name: DAY_NAMES[i], num: fmtDay(d), dateKey: ymd(d) });
    }
    // Actualizar topbar
    const wkEnd = addDays(weekStart, 6);
    document.getElementById('week-range').textContent = `${fmtDay(weekStart)} – ${fmtDay(wkEnd)}`;
    // Cambiar de vista
    monthView.hidden = true;
    weekView.hidden = false;
    cmSub.textContent = 'Arrastra un platillo al día y tiempo que quieras';
    renderWeek();
    renderDishes();
    window.scrollTo(0, 0);
    // Hint en táctil, una vez por sesión
    if (isTouch && !window._hintShown) {
      window._hintShown = true;
      setTimeout(() => {
        showHint('Arrastra desde los ⣿ puntos, o toca el platillo y luego el tiempo');
        setTimeout(hideHint, 4000);
      }, 600);
    }
  }

  function backToMonth() {
    weekView.hidden = true;
    monthView.hidden = false;
    renderMonth(); // refresca contadores y subtítulo estacional
    window.scrollTo(0, 0);
  }

  document.getElementById('prev-month').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderMonth();
  });
  document.getElementById('next-month').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderMonth();
  });
  document.getElementById('back-to-month').addEventListener('click', backToMonth);

  // ===== RENDER SEMANA =====
  const weekCol = document.getElementById('week-col');
  function renderWeek() {
    // limpiar todo menos el label
    weekCol.querySelectorAll('.day-card').forEach(el => el.remove());
    DAYS.forEach((day, di) => {
      const card = document.createElement('div');
      card.className = 'day-card';
      card.innerHTML = `<div class="day-name">${day.name} <span class="day-num">${day.num}</span></div>`;
      MEALS.forEach(meal => {
        const key = `${day.dateKey}-${meal}`;
        const slot = document.createElement('div');
        slot.className = 'meal-slot';
        slot.dataset.key = key;
        const placed = menu[key];
        let contentHtml = `<span class="meal-empty">—</span>`;
        if (placed) {
          const dish = DISHES.find(d => d.id === placed);
          if (dish) {
            contentHtml = `<span class="placed-dish" style="--slot-color:${PROTEIN_COLORS[dish.proteina]}">
              ${dish.nombre}
              <span class="dish-x" data-remove="${key}">×</span>
            </span>`;
          }
        }
        slot.innerHTML = `<span class="meal-label">${meal}</span><div class="meal-content">${contentHtml}</div>`;
        card.appendChild(slot);
      });
      weekCol.appendChild(card);
    });
    bindSlots();
  }

  // ===== RENDER PLATILLOS =====
  let activeProtein = 'todos';
  let searchTerm = '';
  const dishList = document.getElementById('dish-list');
  function renderDishes() {
    dishList.innerHTML = '';
    DISHES.forEach(dish => {
      const matchProtein = activeProtein === 'todos' || dish.proteina === activeProtein;
      const matchSearch = !searchTerm || dish.nombre.toLowerCase().includes(searchTerm.toLowerCase());
      if (!matchProtein || !matchSearch) return;
      const card = document.createElement('div');
      card.className = 'dish-card';
      card.dataset.id = dish.id;
      card.style.setProperty('--dish-color', PROTEIN_COLORS[dish.proteina]);
      card.innerHTML = `
        <div class="dish-handle" data-handle="${dish.id}" aria-label="Arrastrar ${dish.nombre}">
          <div class="dotgrid"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="dish-body" data-body="${dish.id}">
          <div class="dish-name">
            <span class="dish-name-txt">${dish.nombre}<span class="dish-protein-dot"></span></span>
            ${dish.usual && dish.usual.length ? `<span class="usual-pill">usual: ${dish.usual.join(' / ')}</span>` : ''}
          </div>
          <div class="dish-ingredients">${dish.ing.join(' · ')}</div>
        </div>`;
      dishList.appendChild(card);
    });
    bindDishCards();
  }

  // ===== PESTAÑAS =====
  document.getElementById('protein-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.protein-tab');
    if (!tab) return;
    document.querySelectorAll('.protein-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeProtein = tab.dataset.p;
    renderDishes();
  });

  // ===== BÚSQUEDA =====
  const searchInput = document.getElementById('search');
  const searchClear = document.getElementById('search-clear');
  searchInput.addEventListener('input', e => {
    searchTerm = e.target.value;
    searchClear.hidden = !searchTerm;
    renderDishes();
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchTerm = '';
    searchClear.hidden = true;
    renderDishes();
    searchInput.focus();
  });

  // ===== REMOVER PLATILLO DE UN SLOT =====
  function bindSlots() {
    weekCol.querySelectorAll('.dish-x').forEach(x => {
      x.addEventListener('click', e => {
        e.stopPropagation();
        delete menu[x.dataset.remove];
        renderWeek();
      });
    });
  }

  // ===== INTERACCIÓN: DRAG (desktop) + TAP-TAP (móvil) =====
  const tapHint = document.getElementById('tap-hint');
  let tapSelectedDish = null;

  function showHint(html) {
    tapHint.innerHTML = html;
    tapHint.classList.add('show');
  }
  function hideHint() { tapHint.classList.remove('show'); }

  function assignDish(dishId, slotKey) {
    menu[slotKey] = dishId;
    renderWeek();
  }

  // Detectar si es dispositivo táctil
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  function bindDishCards() {
    dishList.querySelectorAll('.dish-card').forEach(card => {
      const dishId = card.dataset.id;
      const handle = card.querySelector('.dish-handle');
      const body = card.querySelector('.dish-body');
      const dish = DISHES.find(d => d.id === dishId);

      // ARRASTRE: solo desde el asa (los puntos). Como el asa tiene
      // touch-action:none, el gesto de arrastre no dispara el scroll.
      handle.addEventListener('pointerdown', e => {
        startDragFromHandle(e, dishId, card);
      });

      // TAP-SELECT: desde el cuerpo de la tarjeta (tocar y luego tocar slot).
      // El cuerpo mantiene touch-action normal → el scroll de la lista fluye.
      body.addEventListener('click', e => {
        if (draggingNow) return;
        handleTapSelect(dishId, card, dish);
      });
    });
  }

  const DRAG_THRESHOLD = 6; // px de movimiento para arrancar el arrastre

  function startDragFromHandle(e, dishId, card) {
    e.preventDefault();
    const dish = DISHES.find(d => d.id === dishId);
    const handle = card.querySelector('.dish-handle');
    const startX = e.clientX, startY = e.clientY;
    let dragStarted = false;
    let ghost = null;

    try { handle.setPointerCapture(e.pointerId); } catch(_) {}

    const onMove = ev => {
      const dist = Math.hypot(ev.clientX - startX, ev.clientY - startY);
      if (!dragStarted && dist > DRAG_THRESHOLD) {
        dragStarted = true;
        draggingNow = true;
        card.classList.add('dragging');
        // Cancelar selección tap-tap si había
        tapSelectedDish = null;
        document.querySelectorAll('.dish-card').forEach(c => c.classList.remove('tap-selected'));
        clearTapTargets();
        hideHint();
        ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.style.setProperty('--dish-color', PROTEIN_COLORS[dish.proteina]);
        ghost.textContent = dish.nombre;
        document.body.appendChild(ghost);
      }
      if (dragStarted) {
        ev.preventDefault();
        if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; }
        const slot = slotAtPoint(ev.clientX, ev.clientY);
        weekCol.querySelectorAll('.meal-slot').forEach(s => s.classList.remove('drop-hover'));
        if (slot) slot.classList.add('drop-hover');
      }
    };

    const onUp = ev => {
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      handle.removeEventListener('pointercancel', onUp);
      if (dragStarted) {
        const slot = slotAtPoint(ev.clientX, ev.clientY);
        if (slot) assignDish(dishId, slot.dataset.key);
        card.classList.remove('dragging');
        weekCol.querySelectorAll('.meal-slot').forEach(s => s.classList.remove('drop-hover'));
        if (ghost) { ghost.remove(); ghost = null; }
        setTimeout(() => { draggingNow = false; }, 50);
      }
    };

    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  }

  function handleTapSelect(dishId, card, dish) {
    if (tapSelectedDish === dishId) {
      tapSelectedDish = null;
      card.classList.remove('tap-selected');
      clearTapTargets();
      hideHint();
    } else {
      tapSelectedDish = dishId;
      document.querySelectorAll('.dish-card').forEach(c => c.classList.remove('tap-selected'));
      card.classList.add('tap-selected');
      markTapTargets();
      showHint(`Ahora toca un tiempo para poner <b>${dish.nombre}</b>`);
    }
  }

  function markTapTargets() {
    weekCol.querySelectorAll('.meal-slot').forEach(s => s.classList.add('tap-target'));
    weekCol.querySelectorAll('.meal-slot').forEach(slot => {
      slot._tapHandler = () => {
        if (!tapSelectedDish) return;
        assignDish(tapSelectedDish, slot.dataset.key);
        tapSelectedDish = null;
        clearTapTargets();
        hideHint();
      };
      slot.addEventListener('click', slot._tapHandler);
    });
  }
  function clearTapTargets() {
    weekCol.querySelectorAll('.meal-slot').forEach(s => {
      s.classList.remove('tap-target');
      if (s._tapHandler) { s.removeEventListener('click', s._tapHandler); s._tapHandler = null; }
    });
  }

  // --- Estado global de drag y helper de posición ---
  let draggingNow = false;
  function slotAtPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    return el ? el.closest('.meal-slot') : null;
  }

  // ===== NIVEL CREAR PLATILLO =====
  const cookView = document.getElementById('cook-view');

  function openCook() {
    draftDish = { nombre:'', usual:[], tipo:null, ingredientes:[] };
    document.getElementById('new-dish-name').value = '';
    document.querySelectorAll('#usual-chips .toggle-chip').forEach(c => c.classList.remove('on'));
    document.querySelectorAll('#type-chips .toggle-chip').forEach(c => c.classList.remove('on'));
    supplyCat = 'todas'; supplySearch = '';
    document.getElementById('supply-search').value = '';
    document.getElementById('supply-clear').hidden = true;
    monthView.hidden = true;
    weekView.hidden = true;
    cookView.hidden = false;
    cmSub.textContent = 'Crea un platillo para tu recetario';
    renderSupplyCats();
    renderSupplies();
    renderDraftIngredients();
    updateFinishBtn();
    window.scrollTo(0, 0);
  }
  function closeCook() {
    cookView.hidden = true;
    monthView.hidden = false;
    renderMonth();
    window.scrollTo(0, 0);
  }

  document.getElementById('cook-btn').addEventListener('click', openCook);
  document.getElementById('back-from-cook').addEventListener('click', closeCook);

  document.getElementById('new-dish-name').addEventListener('input', e => {
    draftDish.nombre = e.target.value.trim();
    updateFinishBtn();
  });

  document.getElementById('usual-chips').addEventListener('click', e => {
    const chip = e.target.closest('.toggle-chip');
    if (!chip) return;
    chip.classList.toggle('on');
    const val = chip.dataset.usual;
    if (chip.classList.contains('on')) { if (!draftDish.usual.includes(val)) draftDish.usual.push(val); }
    else { draftDish.usual = draftDish.usual.filter(u => u !== val); }
  });

  document.getElementById('type-chips').addEventListener('click', e => {
    const chip = e.target.closest('.toggle-chip');
    if (!chip) return;
    document.querySelectorAll('#type-chips .toggle-chip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    draftDish.tipo = chip.dataset.type;
    updateFinishBtn();
  });

  function updateFinishBtn() {
    const ok = draftDish.nombre && draftDish.tipo && draftDish.ingredientes.length > 0;
    document.getElementById('finish-dish').disabled = !ok;
  }

  function renderSupplyCats() {
    const wrap = document.getElementById('supply-cats');
    wrap.innerHTML = '';
    const cats = ['todas', ...SUPPLY_CATS];
    cats.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'protein-tab' + (c === supplyCat ? ' active' : '');
      btn.textContent = c === 'todas' ? 'Todas' : c;
      btn.addEventListener('click', () => { supplyCat = c; renderSupplyCats(); renderSupplies(); });
      wrap.appendChild(btn);
    });
  }

  function renderSupplies() {
    const list = document.getElementById('supply-list');
    list.innerHTML = '';
    SUPPLIES.forEach(sup => {
      const matchCat = supplyCat === 'todas' || sup.cat === supplyCat;
      const matchSearch = !supplySearch || sup.nombre.toLowerCase().includes(supplySearch.toLowerCase());
      if (!matchCat || !matchSearch) return;
      const card = document.createElement('div');
      card.className = 'dish-card';
      card.style.setProperty('--dish-color', 'var(--leaf)');
      card.innerHTML = `
        <div class="dish-handle" aria-label="Arrastrar ${sup.nombre}">
          <div class="dotgrid"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="dish-body">
          <div class="dish-name"><span class="dish-name-txt">${sup.nombre}</span></div>
          <div class="dish-ingredients">${sup.cat}</div>
        </div>`;
      const handle = card.querySelector('.dish-handle');
      const body = card.querySelector('.dish-body');
      handle.addEventListener('pointerdown', e => startSupplyDrag(e, sup, card));
      body.addEventListener('click', () => { if (!draggingNow) askQtyFor(sup); });
      list.appendChild(card);
    });
  }

  const supplySearchEl = document.getElementById('supply-search');
  const supplyClearEl = document.getElementById('supply-clear');
  supplySearchEl.addEventListener('input', e => {
    supplySearch = e.target.value;
    supplyClearEl.hidden = !supplySearch;
    renderSupplies();
  });
  supplyClearEl.addEventListener('click', () => {
    supplySearchEl.value = ''; supplySearch = ''; supplyClearEl.hidden = true;
    renderSupplies(); supplySearchEl.focus();
  });

  function startSupplyDrag(e, sup, card) {
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    let dragStarted = false, ghost = null;
    const handle = card.querySelector('.dish-handle');
    try { handle.setPointerCapture(e.pointerId); } catch(_) {}
    const drop = document.getElementById('ingredients-drop');

    const onMove = ev => {
      const dist = Math.hypot(ev.clientX - startX, ev.clientY - startY);
      if (!dragStarted && dist > 6) {
        dragStarted = true; draggingNow = true; card.classList.add('dragging');
        ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.style.setProperty('--dish-color', 'var(--leaf)');
        ghost.textContent = sup.nombre;
        document.body.appendChild(ghost);
      }
      if (dragStarted) {
        ev.preventDefault();
        ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
        const overDrop = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('#ingredients-drop');
        drop.classList.toggle('drop-hover', !!overDrop);
      }
    };
    const onUp = ev => {
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      handle.removeEventListener('pointercancel', onUp);
      if (dragStarted) {
        const overDrop = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('#ingredients-drop');
        card.classList.remove('dragging');
        drop.classList.remove('drop-hover');
        if (ghost) { ghost.remove(); ghost = null; }
        setTimeout(() => { draggingNow = false; }, 50);
        if (overDrop) askQtyFor(sup);
      }
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  }

  const qtyModal = document.getElementById('qty-modal');
  function askQtyFor(sup) {
    pendingSupply = sup;
    document.getElementById('qty-title').textContent = sup.nombre;
    document.getElementById('qty-value').value = '';
    document.getElementById('qty-unit').value = 'pieza';
    qtyModal.hidden = false;
    setTimeout(() => document.getElementById('qty-value').focus(), 50);
  }
  document.getElementById('qty-cancel').addEventListener('click', () => { qtyModal.hidden = true; pendingSupply = null; });
  document.getElementById('qty-ok').addEventListener('click', () => {
    if (!pendingSupply) return;
    const val = document.getElementById('qty-value').value.trim() || '1';
    const unit = document.getElementById('qty-unit').value;
    draftDish.ingredientes.push({ nombre: pendingSupply.nombre, cantidad: val, unidad: unit });
    qtyModal.hidden = true; pendingSupply = null;
    renderDraftIngredients();
    updateFinishBtn();
  });

  function renderDraftIngredients() {
    const drop = document.getElementById('ingredients-drop');
    const empty = document.getElementById('drop-empty');
    drop.querySelectorAll('.ing-row').forEach(r => r.remove());
    if (draftDish.ingredientes.length === 0) { empty.style.display = ''; return; }
    empty.style.display = 'none';
    draftDish.ingredientes.forEach((ing, idx) => {
      const row = document.createElement('div');
      row.className = 'ing-row';
      const qtyLabel = ing.unidad === 'al gusto' ? 'al gusto' : `${ing.cantidad} ${ing.unidad}`;
      row.innerHTML = `<span class="ing-name">${ing.nombre}</span>
        <span class="ing-qty">${qtyLabel}</span>
        <span class="ing-x">×</span>`;
      row.querySelector('.ing-x').addEventListener('click', () => {
        draftDish.ingredientes.splice(idx, 1);
        renderDraftIngredients(); updateFinishBtn();
      });
      drop.appendChild(row);
    });
  }

  const supplyModal = document.getElementById('supply-modal');
  document.getElementById('add-supply-btn').addEventListener('click', () => {
    document.getElementById('supply-name').value = '';
    const sel = document.getElementById('supply-cat');
    sel.innerHTML = SUPPLY_CATS.map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('supply-msg').textContent = '';
    document.getElementById('supply-msg').className = 'mini-msg';
    document.getElementById('supply-save').disabled = false;
    supplyModal.hidden = false;
  });
  document.getElementById('supply-cancel').addEventListener('click', () => { supplyModal.hidden = true; });
  document.getElementById('supply-save').addEventListener('click', () => {
    const name = document.getElementById('supply-name').value.trim();
    const cat = document.getElementById('supply-cat').value;
    const msg = document.getElementById('supply-msg');
    if (!name) { msg.textContent = 'Escribe un nombre'; msg.className = 'mini-msg err'; return; }
    const exists = SUPPLIES.some(s => s.nombre.toLowerCase() === name.toLowerCase());
    if (exists) { msg.textContent = 'Ese insumo ya existe'; msg.className = 'mini-msg err'; return; }
    SUPPLIES.push({ id: 'i' + Date.now(), nombre: name, cat });
    msg.textContent = 'Agregado ✓'; msg.className = 'mini-msg ok';
    document.getElementById('supply-save').disabled = true;
    renderSupplies();
    setTimeout(() => { supplyModal.hidden = true; }, 700);
  });

  document.getElementById('finish-dish').addEventListener('click', () => {
    const nuevo = {
      id: 'd' + Date.now(),
      nombre: draftDish.nombre,
      proteina: draftDish.tipo,
      usual: [...draftDish.usual],
      ing: draftDish.ingredientes.map(i => i.unidad === 'al gusto' ? `${i.nombre} al gusto` : `${i.nombre} ${i.cantidad} ${i.unidad}`)
    };
    DISHES.push(nuevo);
    showDishDone(nuevo.nombre);
  });

  function showDishDone(nombre) {
    const ov = document.getElementById('dish-done-overlay');
    document.getElementById('dish-done-sub').textContent = nombre;
    ov.hidden = false;
    playDoneChime();
    burstConfetti(ov);
    // Segunda ráfaga de confeti para que se sienta la fiesta
    setTimeout(() => burstConfetti(ov), 350);
    // Se cierra al tocar (con un pequeño bloqueo inicial para que no se cierre por el mismo tap del botón)
    const shownAt = Date.now();
    const closeHandler = () => {
      if (Date.now() - shownAt < 600) return;
      ov.removeEventListener('click', closeHandler);
      ov.hidden = true;
      closeCook();
    };
    ov.addEventListener('click', closeHandler);
  }

  // Confeti simple para la ceremonia
  function burstConfetti(container) {
    const colors = ['#c26a2b', '#d9a441', '#7a8c4e', '#b5563f', '#5b8ca8'];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('span');
      p.style.cssText = `position:absolute;left:50%;top:45%;width:8px;height:8px;border-radius:2px;
        background:${colors[i % colors.length]};pointer-events:none;z-index:5;`;
      container.appendChild(p);
      const ang = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 180;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist + 100;
      p.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(${Math.random()*720}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random()*500, easing: 'cubic-bezier(0.2,0.6,0.4,1)' });
      setTimeout(() => p.remove(), 1500);
    }
  }

  function playDoneChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99];
      notes.forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        const t = ctx.currentTime + i * 0.1;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.15, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.45);
      });
    } catch(_) {}
  }

  // ===== INIT =====
  renderMonth();  // arranca en el nivel mes

</script>
</body>
