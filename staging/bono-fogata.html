<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bono Fogata — Casita Corrales</title>

<!-- Sin manifest ni service worker — esta página es transitoria.
     No queremos que se instale como PWA ni que se cachee agresivamente. -->
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f6ece0;
  --paper: #fdf9f3;
  --ink: #2a1f1a;
  --ink-soft: #5a4c42;
  --muted: #867566;
  --line: #d9c8b3;
  --terra: #c4634a;
  --leaf: #5b7a4e;
  --gold: #c89b3c;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, #f8e4c4 0%, var(--bg) 50%),
    var(--bg);
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 48px 20px 40px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.flame {
  font-size: 72px;
  line-height: 1;
  margin-bottom: 16px;
  animation: flame-flicker 2.4s ease-in-out infinite;
}
@keyframes flame-flicker {
  0%, 100% { transform: scale(1) rotate(-2deg); }
  50%      { transform: scale(1.06) rotate(2deg); }
}

h1 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 32px;
  margin: 0 0 8px;
  text-align: center;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
h1 em {
  font-style: italic;
  color: var(--terra);
}

.lead {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 17px;
  color: var(--ink-soft);
  text-align: center;
  max-width: 380px;
  line-height: 1.5;
  margin: 0 0 36px;
}

.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 28px 24px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 60px -20px rgba(42, 31, 26, 0.15);
}

.card-label {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-align: center;
  margin-bottom: 14px;
}

.pin-input {
  width: 100%;
  padding: 14px 16px;
  font-family: 'Fraunces', serif;
  font-size: 22px;
  text-align: center;
  letter-spacing: 0.3em;
  color: var(--ink);
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  outline: none;
  margin-bottom: 18px;
  transition: border-color 150ms ease;
  -webkit-appearance: none;
}
.pin-input:focus {
  border-color: var(--terra);
}
.pin-input.error {
  border-color: var(--terra);
  animation: shake 400ms ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-6px); }
  40%      { transform: translateX(6px); }
  60%      { transform: translateX(-3px); }
  80%      { transform: translateX(3px); }
}

.error-msg {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--terra);
  text-align: center;
  margin-bottom: 14px;
  min-height: 18px;
}

.big-btn {
  width: 100%;
  padding: 18px 24px;
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 20px;
  color: var(--paper);
  background: linear-gradient(135deg, var(--terra) 0%, #a85540 100%);
  border: none;
  border-radius: 14px;
  cursor: pointer;
  letter-spacing: -0.01em;
  box-shadow: 0 12px 24px -8px rgba(196, 99, 74, 0.4);
  transition: all 200ms ease;
  -webkit-tap-highlight-color: transparent;
}
.big-btn:hover:not(:disabled),
.big-btn:active:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 16px 30px -8px rgba(196, 99, 74, 0.5);
}
.big-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.big-btn.processing {
  opacity: 0.7;
  cursor: wait;
}

.detail {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin-top: 18px;
  line-height: 1.5;
}
.detail strong {
  color: var(--ink);
  font-weight: 600;
}

/* Estado: ya reclamado */
.claimed-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 32px 24px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.claimed-icon {
  font-size: 48px;
  margin-bottom: 16px;
}
.claimed-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 22px;
  color: var(--ink);
  margin-bottom: 12px;
}
.claimed-detail {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.55;
}
.claimed-detail strong {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  color: var(--terra);
}

/* Estado: éxito recién */
.success-card {
  background: linear-gradient(135deg, #fef0e0 0%, #fde0c4 100%);
  border: 2px solid var(--terra);
  border-radius: 18px;
  padding: 32px 24px;
  width: 100%;
  max-width: 380px;
  text-align: center;
  animation: success-pop 600ms cubic-bezier(0.2, 0.8, 0.2, 1.3);
}
@keyframes success-pop {
  0%   { transform: scale(0.85); opacity: 0; }
  60%  { transform: scale(1.04); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.success-icon {
  font-size: 56px;
  margin-bottom: 16px;
}
.success-title {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 26px;
  color: #5a2a14;
  margin-bottom: 12px;
}
.success-detail {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: #5a2a14;
  line-height: 1.6;
  margin-bottom: 20px;
}
.recipient-list {
  background: rgba(255, 255, 255, 0.5);
  border-radius: 12px;
  padding: 14px 16px;
  margin-top: 16px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  color: #5a2a14;
  text-align: left;
}
.recipient-list div {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
}
.recipient-list div + div {
  border-top: 1px dashed rgba(90, 42, 20, 0.2);
}
.recipient-list strong {
  font-weight: 600;
}
.recipient-list span {
  color: var(--leaf);
  font-weight: 600;
  font-family: 'Fraunces', serif;
}

.footer-note {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 32px;
  letter-spacing: 0.04em;
  opacity: 0.7;
}

/* Loading inicial mientras verifica si ya se reclamó */
.loading {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 15px;
  color: var(--muted);
  text-align: center;
  padding: 40px 0;
}

</style>
</head>
<body>

<div class="wrap">
  <div class="flame">🔥</div>
  <h1>Bono de bienvenida a <em>Fogata</em></h1>
  <p class="lead">Un regalo para la familia tras los días de mantenimiento. 20 puntos para cada miembro activo de la casita.</p>

  <div id="main-content">
    <div class="loading">Cargando…</div>
  </div>

  <div class="footer-note">Casita Corrales — era Fogata · cutover 2026-05-30</div>
</div>

<!-- Firebase SDK (compat para que funcione fuera de la app) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ===================================================================
   CONFIGURACIÓN
   =================================================================== */

// PIN de Emmanuel — CAMBIAR antes de subir a producción
const ADMIN_PIN = 'CHANGE_ME';

// Bono otorgado a cada miembro activo (no Matías)
const BONUS_AMOUNT = 20;

// Miembros que reciben el bono (todos menos Matías que es pasivo)
const RECIPIENTS = {
  emm: 'Emmanuel',
  mar: 'Mariel',
  jov: 'Jovanny',
  lup: 'Lupita'
};

// Firebase config — DEBE apuntar a PRODUCCIÓN
// Copiar la misma config que está en fogata/index.html
const FIREBASE_CONFIG = {
  // apiKey: "...",
  // authDomain: "...",
  // databaseURL: "...",
  // projectId: "...",
  // storageBucket: "...",
  // messagingSenderId: "...",
  // appId: "..."
};

const BONUS_FLAG_PATH = 'casita/bonusFogataClaimed';

/* ===================================================================
   INICIALIZACIÓN
   =================================================================== */
let db = null;

function init() {
  if (ADMIN_PIN === 'CHANGE_ME') {
    showError('⚠️ Configuración incompleta. Edita ADMIN_PIN antes de usar.');
    return;
  }
  if (!FIREBASE_CONFIG.databaseURL) {
    showError('⚠️ Configuración de Firebase faltante. Edita FIREBASE_CONFIG.');
    return;
  }

  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
  } catch (e) {
    showError('No se pudo conectar a Firebase: ' + e.message);
    return;
  }

  checkClaimedStatus();
}

function showError(msg) {
  document.getElementById('main-content').innerHTML = `
    <div class="claimed-card">
      <div class="claimed-icon">⚠️</div>
      <div class="claimed-title">Algo está mal</div>
      <div class="claimed-detail">${msg}</div>
    </div>
  `;
}

/* Verifica si el bono ya se entregó */
async function checkClaimedStatus() {
  try {
    const snap = await db.ref(BONUS_FLAG_PATH).once('value');
    const claimed = snap.val();
    if (claimed && claimed.timestamp) {
      renderAlreadyClaimed(claimed);
    } else {
      renderClaimForm();
    }
  } catch (e) {
    showError('No se pudo verificar el estado: ' + e.message);
  }
}

/* Vista cuando el bono ya se entregó */
function renderAlreadyClaimed(claimedData) {
  const date = new Date(claimedData.timestamp);
  const dateStr = date.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
  const timeStr = date.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('main-content').innerHTML = `
    <div class="claimed-card">
      <div class="claimed-icon">✓</div>
      <div class="claimed-title">Este bono ya se entregó</div>
      <div class="claimed-detail">
        Se reclamó el <strong>${dateStr}</strong> a las <strong>${timeStr}</strong>.<br>
        Cada miembro activo recibió <strong>${BONUS_AMOUNT} puntos</strong>.
      </div>
    </div>
  `;
}

/* Vista para reclamar el bono (PIN + botón) */
function renderClaimForm() {
  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <div class="card-label">PIN del arquitecto</div>
      <input type="password" inputmode="numeric" class="pin-input" id="pin-input"
             placeholder="••••" autocomplete="off">
      <div class="error-msg" id="error-msg"></div>
      <button class="big-btn" id="claim-btn">Entregar bono a la familia</button>
      <div class="detail">
        Cada miembro activo recibirá<br>
        <strong>+${BONUS_AMOUNT} pts</strong> al saldo y al acumulado histórico.<br>
        Aparecerá en su historial como <em>"recibió bono Fogata"</em>.
      </div>
    </div>
  `;

  const btn = document.getElementById('claim-btn');
  const pinInput = document.getElementById('pin-input');
  const errEl = document.getElementById('error-msg');

  // Enter dispara el botón
  pinInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      btn.click();
    }
  });

  // Limpiar error al escribir
  pinInput.addEventListener('input', () => {
    pinInput.classList.remove('error');
    errEl.textContent = '';
  });

  btn.addEventListener('click', async () => {
    if (btn.classList.contains('processing')) return;

    const pin = pinInput.value.trim();
    if (pin !== ADMIN_PIN) {
      pinInput.classList.add('error');
      errEl.textContent = 'PIN incorrecto';
      pinInput.value = '';
      pinInput.focus();
      return;
    }

    btn.classList.add('processing');
    btn.disabled = true;
    btn.textContent = 'Entregando…';

    try {
      const result = await deliverBonus();
      renderSuccess(result);
    } catch (e) {
      btn.classList.remove('processing');
      btn.disabled = false;
      btn.textContent = 'Entregar bono a la familia';
      errEl.textContent = 'Falló: ' + e.message;
    }
  });
}

/* Entrega el bono.
   1. Re-verifica que no se haya reclamado (race condition guard)
   2. Marca el flag como reclamado ANTES de las transacciones (lock)
   3. Por cada miembro: incrementa scores y lifetimeScores con transactions
   4. Por cada miembro: añade entrada al history
   5. Retorna el resumen
*/
async function deliverBonus() {
  // GUARD: re-verificar atómicamente que no se reclamó
  // Usamos transaction sobre el flag — si ya existe, abort
  const flagRef = db.ref(BONUS_FLAG_PATH);
  const lockResult = await new Promise((resolve, reject) => {
    flagRef.transaction(current => {
      if (current && current.timestamp) {
        return; // abort: ya se reclamó
      }
      return {
        timestamp: Date.now(),
        amount: BONUS_AMOUNT,
        recipients: Object.keys(RECIPIENTS)
      };
    }, (error, committed, snapshot) => {
      if (error) { reject(error); return; }
      if (!committed) {
        reject(new Error('El bono ya había sido reclamado'));
        return;
      }
      resolve(snapshot.val());
    }, false);
  });

  // Ejecutar transacciones de scores y lifetimeScores en paralelo
  const personKeys = Object.keys(RECIPIENTS);
  const transactionPromises = [];

  personKeys.forEach(key => {
    // scores
    transactionPromises.push(new Promise((resolve, reject) => {
      db.ref(`casita/scores/${key}`).transaction(current => {
        return (typeof current === 'number' ? current : 0) + BONUS_AMOUNT;
      }, (err, committed) => {
        if (err) reject(err);
        else resolve();
      }, false);
    }));

    // lifetimeScores
    transactionPromises.push(new Promise((resolve, reject) => {
      db.ref(`casita/lifetimeScores/${key}`).transaction(current => {
        return (typeof current === 'number' ? current : 0) + BONUS_AMOUNT;
      }, (err, committed) => {
        if (err) reject(err);
        else resolve();
      }, false);
    }));
  });

  await Promise.all(transactionPromises);

  // Añadir entradas al historial (una por miembro)
  const historyPromises = personKeys.map(key => {
    return db.ref('casita/history').push({
      ts: Date.now(),
      by: key,
      taskName: 'era Fogata',
      action: `recibió bono · +${BONUS_AMOUNT} pts`
    });
  });
  await Promise.all(historyPromises);

  return {
    timestamp: lockResult.timestamp,
    recipients: personKeys.map(k => ({ key: k, name: RECIPIENTS[k] }))
  };
}

/* Vista de éxito tras reclamar */
function renderSuccess(result) {
  const listHtml = result.recipients.map(r =>
    `<div><strong>${r.name}</strong> <span>+${BONUS_AMOUNT} pts</span></div>`
  ).join('');

  document.getElementById('main-content').innerHTML = `
    <div class="success-card">
      <div class="success-icon">🎉</div>
      <div class="success-title">¡Bono entregado!</div>
      <div class="success-detail">
        La familia recibió su bono de bienvenida a Fogata.<br>
        Aparecerá en sus saldos y en el historial.
      </div>
      <div class="recipient-list">
        ${listHtml}
      </div>
    </div>
  `;
}

/* Arrancar */
init();
</script>

</body>
</html>
